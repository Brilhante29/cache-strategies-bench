spring.main.web-application-type=none
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/cachebench}
spring.datasource.username=${POSTGRES_USER:cachebench}
spring.datasource.password=${POSTGRES_PASSWORD:cachebench}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.flyway.enabled=true
benchmark.cache-ttl=${CACHE_TTL:60s}
benchmark.result-path=${RESULT_PATH:benchmarks/results/cache-strategies-v2.json}
benchmark.repeats=${BENCHMARK_REPEATS:3}
benchmark.warmup-operations=${WARMUP_OPERATIONS:200}
benchmark.measured-operations=${MEASURED_OPERATIONS:2000}
benchmark.enabled=${BENCHMARK_ENABLED:true}
spring.lifecycle.timeout-per-shutdown-phase=5s
spring.main.banner-mode=off
logging.level.com.portfolio.cachebench=INFO
