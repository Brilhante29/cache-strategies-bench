name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: docker run --rm -v "$(pwd):/app" -w /app gradle:8-jdk21 gradle test --no-daemon

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t cache-strategies-bench .
      - name: Run benchmark
        run: docker run --rm cache-strategies-bench
