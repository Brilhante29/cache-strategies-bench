name: CI

on:
  push:
    branches: [main, "codex/**", "agent/**"]
  pull_request:
    branches: [main, "codex/**", "agent/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run tests
        run: docker run --rm -v "$(pwd):/app" -w /app gradle:8-jdk21 gradle test --no-daemon

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build Docker image
        run: docker build -t cache-strategies-bench .
      - name: Run benchmark
        run: docker run --rm cache-strategies-bench
