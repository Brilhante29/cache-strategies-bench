id: 19
name: cache-strategies-bench
manifest_version: 2
program:
  id: backend-reliability-platform
  narrative_fit: "Accelerates the read path after payments, events, saga state, and outbox delivery establish the transactional source of truth."
  shared_assets:
    - commerce product read model
    - benchmark result v2
    - infrastructure port parity pattern
status: ready
claim: "Cache-aside and write-through are compared on real Redis and PostgreSQL with reproducible latency, hit-ratio, throughput, and consistency evidence."
stack:
  - java-21
  - spring-boot-3.4
  - spring-jdbc
  - spring-data-redis
  - lettuce
  - postgresql-16
  - redis-7
  - flyway
  - jackson
  - junit-5
  - gradle-8.10
  - docker-compose
language_profile:
  primary: java-backend
  secondary: []
  reason: "Java keeps this JVM repository interoperable with the Kotlin payment and saga services while explicit ports expose infrastructure substitution."
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: backend-reliability-platform
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker-compose
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: reviewed
  principles:
    coupling_rule: "Strategies depend on ProductCache and ProductRepository ports; Spring, Redis, JDBC, Flyway, and Docker remain adapters."
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: "One product model, two strategies, Redis, PostgreSQL, and one deterministic workload."
    testability_rule: "In-memory and real adapters share contracts; pure strategy tests run without Spring."
    rejected_overengineering:
      - REST API
      - GraphQL
      - Kafka or RabbitMQ
      - JPA
      - Kubernetes
  stack_profile: java-backend
  api_style: cli
  messaging: none
  cloud:
    mode: local-first
    local_provider: docker-compose
    real_provider_target: managed-postgresql-and-redis
    emulated_services: []
    adapter_rule: "Cloud endpoints change adapter configuration only; cloud SDKs never enter domain code."
    config_switch: "POSTGRES_URL and REDIS_HOST"
    unsupported_behaviors:
      - managed failover
      - multi-region latency
  database: postgresql
  runtime: "Java 21, PostgreSQL 16, Redis 7"
  library_policy: "Spring JDBC exposes SQL; Spring Data Redis manages Lettuce and TTL; Flyway owns schema; Jackson emits benchmark V2."
  record_path: sdd/technical-decision.md
architecture:
  style: hexagonal
  reason: "The benchmark must substitute in-memory test doubles and networked infrastructure without changing strategy behavior."
  problem_forces:
    domain_complexity: low
    integration_pressure: high
    ui_state_complexity: none
    data_or_ml_reproducibility: medium
    auditability: medium
    throughput_or_async: medium
    independent_deployability: low
  dependency_rule: "Adapters depend inward on domain ports; domain packages import no application, Spring, Redis, JDBC, or Docker types."
  boundaries:
    - product and cache strategy domain
    - cache and repository output ports
    - Redis and PostgreSQL adapters
    - deterministic benchmark producer
design_system:
  tokens: .portfolio/design-system/tokens.yaml
  readme_components: [readme_header, benchmark_card, architecture_card, references_table]
  diagram_required: true
reuse:
  kit_version: local
  uses:
    - backend-reliability-platform component pack
    - benchmark-result-v2 contract
    - java language profile
    - architecture selector
    - reuse improvement loop
benchmark:
  primary_metric: write_through_p95_latency_ms
  unit: milliseconds
  command: powershell -NoProfile -ExecutionPolicy Bypass -File tools/benchmark.ps1
  result_path: benchmarks/results/cache-strategies-v2.json
  evidence_status: current
release:
  docker: docker compose up --build --abort-on-container-exit --exit-code-from benchmark benchmark
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
