id: 19
name: cache-strategies-bench
program:
  id: backend-reliability-platform
  narrative_fit: >
    Proves cache strategy tradeoffs (cache-aside vs write-through) with
    reproducible hit_ratio and p95_latency_ms metrics.
  shared_assets:
    - benchmark design pattern (strategy-per-run, warmup-then-workload)
status: benchmarked
claim: cache-aside vs write-through
stack:
  - java21
  - spring-boot
  - docker
language_profile:
  primary: java
  secondary: []
  reason: >
    Java with Spring Boot provides idiomatic caching patterns and
    reproducible benchmark infrastructure for a backend reliability claim.
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: default-portfolio-project
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: completed
  principles:
    coupling_rule: domain/use cases do not depend on framework, database, broker, cloud SDK, transport, or UI
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: >
      One Product entity, one Repository port, two strategy implementations,
      one in-memory cache, one in-memory store with simulated latency.
      No ORM, no real database, no external services.
    testability_rule: >
      All strategies are pure Java with no Spring dependency; tested with
      plain JUnit 5. Benchmark runs as CommandLineRunner.
    rejected_overengineering:
      - Spring Data JPA / real PostgreSQL (unnecessary for strategy comparison)
      - Redis / external cache (in-memory is sufficient for microbenchmark)
      - WebFlux / reactive (blocking I/O matches the simulated DB latency claim)
  stack_profile: java
  api_style: rest-http
  messaging: none
  cloud:
    mode: none
    local_provider: none
    real_provider_target: none
    emulated_services: []
    adapter_rule: n/a
    config_switch: none
    unsupported_behaviors: []
  database: none (in-memory simulation)
  runtime: docker (multi-stage build, eclipse-temurin JRE)
  library_policy: >
    Spring Boot starter-web for REST scaffold, Jackson for JSON output.
    No persistence, caching, or messaging libraries â€” all in-memory.
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: Redis + PostgreSQL (full stack)
      reason: >
        Adds Docker Compose complexity without changing the cache strategy
        comparison. In-memory cache + simulated DB latency is sufficient
        for the benchmark claim.
    - option: Kotlin
      reason: >
        Java is the primary language profile. Kotlin would add unnecessary
        language complexity for this benchmark.
architecture:
  style: layered
  reason: >
    Simple layered architecture with domain (entities + ports + strategies),
    application (services + cache + store), and benchmark (runner + results).
    No complex boundaries needed for a benchmark comparing two strategies.
  problem_forces:
    domain_complexity: low
    integration_pressure: low
    ui_state_complexity: none
    data_or_ml_reproducibility: medium
    auditability: low
    throughput_or_async: low
    independent_deployability: low
  dependency_rule: >
    domain depends on application (InMemoryCache) for strategy implementations.
    Benchmark depends on application. All classes are in a single JAR.
  boundaries:
    - domain: Product, ProductRepository, CacheStrategy, CacheAsideStrategy, WriteThroughStrategy
    - application: InMemoryCache, InMemoryProductStore, CacheBenchService, ProductController
    - benchmark: BenchmarkRunner, BenchmarkResult, StrategyResult
  rejected_alternatives:
    - style: hexagonal
      reason: >
        Overkill for a two-strategy benchmark with no adapter swapping.
        The layering matches the problem scope.
    - style: clean-architecture
      reason: >
        Extra ceremony (use cases, repositories as interfaces, dependency
        inversion) would obscure the benchmark result.
design_system:
  tokens: design-system/tokens.yaml
  readme_components:
    - readme_header
    - benchmark_card
    - architecture_card
    - references_table
  diagram_required: false
reuse:
  kit_version: local
  uses:
    - catalog
    - programs
    - proficiency-map
    - component-packs
    - openspec-schema
    - decision-brain
    - agent-graph
    - reuse-improvement-loop
    - architecture
    - language-profiles
    - design-system
    - sdd
    - harness
    - templates
    - skills
benchmark:
  primary_metric: hit_ratio
  unit: unit
  command: docker run --rm cache-strategies-bench
  result_path: benchmarks/results/benchmark-result.json
release:
  docker: docker run --rm cache-strategies-bench
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
